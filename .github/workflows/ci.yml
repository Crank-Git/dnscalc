name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Formatting: fail if any file is not gofmt-clean.
      - name: gofmt
        run: |
          UNFMTED=$(gofmt -l .)
          if [ -n "$UNFMTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFMTED"
            exit 1
          fi

      # Static checks.
      - name: go vet
        run: go vet ./...

      # dig for the e2e test; DNSCALC_REQUIRE_DIG makes it fail, not skip,
      # if dig is missing.
      - name: install dig
        run: command -v dig || (sudo apt-get update && sudo apt-get install -y dnsutils)

      # Tests with the race detector.
      - name: go test -race
        env:
          DNSCALC_REQUIRE_DIG: "1"
        run: go test -race ./...

      # Fuzz run: must never panic.
      - name: fuzz
        run: go test -run='^$' -fuzz='FuzzEvaluate' -fuzztime=30s
